[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "doga-hermes"
version = "1.4.0"
description = "Probabilistic, goal-aware thinking layer for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0z1-ghb" }]
requires-python = ">=3.10"
keywords = ["hermes", "hermes-agent", "plugin", "thinking", "monte-carlo", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
memory = ["mnemosyne-memory"]
laya = ["laya>=0.3.20,<1"]

[project.urls]
Homepage = "https://github.com/bojansandhaus/doga-jev-hermes"
Repository = "https://github.com/bojansandhaus/doga-jev-hermes"

[tool.setuptools.packages.find]
include = ["doga*"]
namespaces = false
